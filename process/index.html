<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>How we work — SHORELINE BUREAU</title><style>
:root{--ink:#171717;--muted:#77736d;--line:#e8e5df;--accent:#a66b52}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.site-header{height:92px;padding:0 clamp(24px,5.2vw,84px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.wordmark{color:var(--ink);text-decoration:none;font-size:clamp(19px,2vw,25px);font-weight:700;letter-spacing:-.075em;white-space:nowrap}.wordmark span{font-weight:400}.wordmark sup{margin-left:3px;font-size:.28em;font-weight:400;letter-spacing:0;vertical-align:top}.menu-toggle{display:flex;align-items:center;gap:15px;padding:12px 0 12px 16px;border:0;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.menu-icon{width:25px;height:18px;display:flex;flex-direction:column;justify-content:space-between}.menu-icon i{display:block;width:25px;height:1px;background:var(--ink);transition:transform .25s ease}.menu-toggle[aria-expanded=true] .menu-icon i:first-child{transform:translateY(8.5px) rotate(45deg)}.menu-toggle[aria-expanded=true] .menu-icon i:last-child{transform:translateY(-8.5px) rotate(-45deg)}.menu-toggle[aria-expanded=true] .menu-icon i:nth-child(2){opacity:0}.menu-panel{position:fixed;z-index:10;inset:92px 0 0;display:none;background:rgba(255,255,255,.985);padding:clamp(36px,7vw,100px) clamp(24px,9vw,144px)}.menu-panel.is-open{display:flex;flex-direction:column}.menu-kicker{margin:0 0 28px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}.menu-links{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(15px,2.8vh,28px)}.menu-links a{color:var(--ink);text-decoration:none;font-size:clamp(30px,5.2vw,66px);font-weight:400;letter-spacing:-.065em;line-height:1.05}.menu-links a:hover{color:var(--accent)}.menu-footer{margin-top:auto;padding-top:40px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.page-content{padding:clamp(64px,10vw,140px) clamp(24px,9vw,144px)}h1{margin:0;font-size:clamp(42px,8vw,100px);font-weight:400;letter-spacing:-.075em;line-height:.98}@media(max-width:600px){.site-header{height:76px;padding:0 22px}.menu-panel{inset:76px 0 0;padding:52px 26px 32px}.menu-toggle{gap:10px;font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="site-header"><a class="wordmark" href="/" aria-label="SHORELINE BUREAU home">SHORELINE <span>BUREAU</span><sup>®</sup></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"><span>Menu</span><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span></button></header><nav class="menu-panel" id="site-menu" aria-label="Main navigation"><p class="menu-kicker">Explore Shoreline Bureau</p><div class="menu-links"><a href="/about/">About us</a><a href="/services/">Our services</a><a href="/pricing/">Pricing</a><a href="/process/">How we work</a></div><div class="menu-footer">Independent Property &amp; Place Advisory · Hurghada, Egypt</div></nav><main class="page-content"><h1>How we work</h1></main><script>const t=document.querySelector('.menu-toggle'),m=document.querySelector('.menu-panel');function closeMenu(){t.setAttribute('aria-expanded','false');m.classList.remove('is-open')}t.addEventListener('click',()=>{const o=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',String(o));m.classList.toggle('is-open',o)});m.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});</script></body></html>
