<style>
html,body{margin:0;min-height:100%;background:#fff;font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.consultation-content{padding:52px 24px 48px;text-align:center}
.consultation-intro{max-width:620px;margin:0 auto 28px;color:#292929;font-size:18px;line-height:1.5;font-weight:400}
.consultation-actions{display:flex;justify-content:center;align-items:center;gap:14px}
.consultation-button{display:inline-flex;justify-content:center;align-items:center;gap:11px;min-width:170px;min-height:54px;padding:0 26px;border:0;border-radius:8px;color:#fff;text-decoration:none;font:600 15px Helvetica,Arial,sans-serif;letter-spacing:.01em;transition:filter .2s,transform .2s}
.consultation-button:hover{filter:brightness(.93);transform:translateY(-1px)}
.consultation-button svg{width:21px;height:21px;flex:none;fill:currentColor}
.consultation-button--telegram{background:#229ED9}
.consultation-button--whatsapp{background:#25D366}
.consultation-meetings{margin:30px auto 0;max-width:600px}
.consultation-meetings p{margin:0 0 17px;color:#555;font-size:14px;line-height:1.55}
.consultation-platforms{display:flex;justify-content:center;align-items:center;gap:30px}
.consultation-platform{display:flex;align-items:center;gap:8px;color:#333;font-size:14px;font-weight:600}
.consultation-platform svg{width:30px;height:30px;flex:none}
@media(max-width:520px){.consultation-content{padding:36px 24px}.consultation-intro{font-size:16px;margin-bottom:24px}.consultation-actions{flex-direction:column;gap:12px}.consultation-button{width:min(100%,320px);box-sizing:border-box}.consultation-meetings{margin-top:28px}.consultation-meetings p{font-size:13px}.consultation-platforms{gap:22px}.consultation-platform{font-size:13px}}
