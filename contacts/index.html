<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Contact SHORELINE BUREAU, an independent property and place advisory bureau in Hurghada, Red Sea, Egypt.">
<title>Contacts — SHORELINE BUREAU</title>
<link rel="stylesheet" href="/assets/site-header.css?v=20261120-3">
<style>
:root{--ink:#171717;--muted:#77736d;--line:#e8e5df;--accent:#337695}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.contact-page{min-height:calc(100vh - 92px);padding:clamp(68px,10vw,142px) clamp(24px,9vw,144px) 80px}
.contact-eyebrow{margin:0 0 28px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
h1{max-width:900px;margin:0;font-size:clamp(48px,9vw,112px);font-weight:400;letter-spacing:-.075em;line-height:.94}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.7fr);gap:48px;margin-top:clamp(68px,10vw,130px);padding-top:26px;border-top:1px solid var(--line)}
.contact-label{margin:0 0 14px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.contact-location{margin:0;font-size:clamp(22px,3vw,34px);font-weight:400;letter-spacing:-.045em;line-height:1.2}
.contact-description{max-width:440px;margin:0;color:#55514c;font-size:15px;line-height:1.7}
.contact-cta{display:inline-flex;align-items:center;justify-content:center;margin-top:28px;padding:13px 20px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.04em;transition:background .2s ease,transform .2s ease}
.contact-cta:hover{background:#28647f;transform:translateY(-1px)}
@media(max-width:650px){.contact-page{min-height:calc(100svh - 76px);padding:68px 24px 60px}.contact-grid{grid-template-columns:1fr;gap:38px;margin-top:72px}.contact-description{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="site-header-root"></div>
<script src="/assets/site-header.js?v=20261120-3" defer></script>
<main class="contact-page">
<p class="contact-eyebrow">SHORELINE BUREAU · CONTACTS</p>
<h1>Let’s start a conversation.</h1>
<section class="contact-grid" aria-label="Contact information">
<div><p class="contact-label">Location</p><p class="contact-location">Hurghada<br>Red Sea, Egypt</p></div>
<div><p class="contact-label">Enquiries</p><p class="contact-description">For property-related enquiries and an initial conversation about your plans, get in touch through our free online consultation.</p><a class="contact-cta" href="/consultation/">Free online consultation</a></div>
</section>
</main>
</body>
</html>
