name: SHORELINE Editorial News

on:
  push:
    paths:
      - 'scripts/publish_news.py'
      - '.github/workflows/editorial-news.yml'
  schedule:
    - cron: "0 10 * * 3,6"
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated article (leave off for a safe preview)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: shoreline-editorial-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate editorial article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            python scripts/publish_news.py
          else
            python scripts/publish_news.py --dry-run
          fi
