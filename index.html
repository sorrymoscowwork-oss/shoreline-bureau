<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="SHORELINE BUREAU — Independent Property & Place Advisory in Hurghada, Egypt.">
  <title>SHORELINE BUREAU — Independent Property & Place Advisory</title>
  <style>
    :root { color-scheme:light; --ink:#171717; --muted:#77736d; --line:#e8e5df; --accent:#a66b52; }
    * { box-sizing:border-box; }
    html { min-height:100%; scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; background:#fff; color:var(--ink); font-family:Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    .brand-lockup{display:flex;flex-direction:column;align-items:flex-start;align-content:flex-start;width:max-content;gap:5px}.brand-lockup .wordmark{display:block;align-self:flex-start;margin:0;padding:0}.brand-lockup .brand-division{display:block;align-self:flex-start;margin:0;padding:0;text-indent:0;font-size:8px;line-height:1;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:#777}
    main { min-height:calc(100vh - 93px); }
    .landing { min-height:calc(100vh - 93px); position:relative; display:grid; grid-template-columns:50% 50%; overflow:hidden; background:#fff; }
    .landing-image { grid-column:1; grid-row:1; min-height:calc(100vh - 93px); overflow:hidden; background:#b6a28b; }
    .landing-image img { display:block; width:100%; height:100%; min-height:calc(100vh - 93px); object-fit:cover; object-position:center 52%; }
    .landing-location { position:absolute; z-index:2; top:calc(23% + clamp(30px,4.2vw,70px) * .98 + 16px); left:0; width:100%; display:grid; grid-template-columns:50% 50%; align-items:baseline; margin:0; font-size:clamp(16px,1.4vw,21px); font-weight:600; letter-spacing:-.045em; line-height:1; text-transform:uppercase; pointer-events:none; }
    .landing-location .hurghada { color:#fff; text-align:right; padding-right:.08em; }
    .landing-location .red-sea { color:var(--ink); text-align:left; padding-left:.08em; }
    .landing-tagline { position:absolute; z-index:2; top:calc(23% + clamp(30px,4.2vw,70px) * .98 + 16px + clamp(16px,1.4vw,21px) + 6px); left:0; width:100%; display:grid; grid-template-columns:50% 50%; grid-auto-rows:auto; row-gap:4px; align-items:baseline; margin:0; font-size:clamp(11px,1vw,15px); font-weight:500; letter-spacing:-.045em; line-height:1.15; pointer-events:none; }
    .landing-tagline .independent { grid-column:2; color:var(--ink); text-align:left; padding-left:.08em; font-weight:700; }
    .landing-tagline .interests { grid-column:2; color:var(--ink); text-align:left; padding-left:.08em; }
    .landing-wordmark { position:absolute; z-index:2; inset:23% 0 auto; width:100%; display:grid; grid-template-columns:50% 50%; align-items:baseline; margin:0; white-space:nowrap; font-size:clamp(30px,4.2vw,70px); line-height:.9; letter-spacing:-.095em; font-weight:700; pointer-events:none; }
    .landing-wordmark .shoreline { display:block; color:#fff; text-align:right; padding-right:.08em; }
    .landing-wordmark .bureau { display:block; position:relative; color:var(--ink); font-weight:400; text-align:left; padding-left:.08em; padding-right:.38em; }
    .landing-wordmark .bureau sup { position:absolute; top:-.12em; right:0; margin:0; color:var(--ink); font-size:.16em; line-height:1; letter-spacing:0; }
    .sailing-boat { position:absolute; z-index:3; top:calc(23% - clamp(34px,4.2vw,58px)); left:0; width:clamp(58px,5vw,82px); aspect-ratio:180 / 140; background:#fff; -webkit-mask:url('/assets/sailboat.svg') center / contain no-repeat; mask:url('/assets/sailboat.svg') center / contain no-repeat; pointer-events:none; will-change:left,transform; }
    .sailing-boat-blue { position:absolute; inset:0; display:block; background:#337695; clip-path:inset(0 0 0 100%); will-change:clip-path; }
    @media (max-width:600px) { .sailing-boat { top:calc(23% - clamp(24px,6vw,36px)); width:clamp(38px,9vw,52px); } }
    @media (max-width:600px) { .sailing-boat { top:calc(23% - clamp(17px,4.8vw,27px)); width:clamp(23px,6vw,32px); } }
    @media (max-width:600px) {
      main { min-height:calc(100svh - 77px); }
      .landing { min-height:calc(100svh - 77px); grid-template-columns:50% 50%; }
      .landing-image, .landing-image img { min-height:calc(100svh - 77px); }
      .landing-image img { object-position:48% center; }
      .landing-location { top:calc(23% + clamp(30px,8vw,38px) * .98 + 12px); left:0; width:100%; font-size:clamp(13px,3.8vw,16px); letter-spacing:-.045em; }
      .landing-tagline { top:calc(23% + clamp(30px,8vw,38px) * .98 + 12px + clamp(13px,3.8vw,16px) + 7px); row-gap:4px; font-size:clamp(10px,3vw,13px); letter-spacing:-.045em; }
      .landing-wordmark { inset:23% 0 auto; grid-template-columns:50% 50%; font-size:clamp(28px,9vw,38px); letter-spacing:-.09em; }
      .sailing-boat { top:calc(23% - clamp(32px,8.2vw,42px)); width:clamp(46px,12vw,60px); }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
<link rel="stylesheet" href="/assets/site-header.css?v=20261120-2"></head>
<body>
  <div id="site-header-root"></div><script src="/assets/site-header.js?v=20261117-9" defer></script>
  <main>
    <section class="landing" aria-label="SHORELINE BUREAU">
      <div class="landing-image"><img src="/assets/shoreline-courtyard.png" alt="Sunlit residential architecture in Hurghada, Egypt"></div>
      <p class="landing-location"><span class="hurghada">HURGHADA</span><span class="red-sea">RED SEA</span></p>
      <p class="landing-tagline"><span class="independent">Independent Property</span><span class="interests">Purchase Advisory</span><span class="independent">Legal &amp; Technical</span><span class="interests">Support</span><span class="independent">20 Years of Local</span><span class="interests">Market Experience</span></p>
<h1 class="landing-wordmark"><span class="shoreline">SHORELINE</span> <span class="bureau">BUREAU</span></h1>
      <span class="sailing-boat" aria-hidden="true"><span class="sailing-boat-blue"></span></span>
    </section>
  </main>
  <script>
    (() => {
      const boat = document.querySelector('.sailing-boat');
      const blue = document.querySelector('.sailing-boat-blue');
      const landing = document.querySelector('.landing');
      const shoreline = document.querySelector('.landing-wordmark .shoreline');
      const bureau = document.querySelector('.landing-wordmark .bureau');
      if (!boat || !blue || !landing || !shoreline || !bureau) return;
      let movement, color;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function textBounds(element) {
        const range = document.createRange();
        range.selectNodeContents(element);
        return range.getBoundingClientRect();
      }

      function positionBoat() {
        if (movement) movement.cancel();
        if (color) color.cancel();
        const area = landing.getBoundingClientRect();
        const shoreText = textBounds(shoreline);
        const bureauText = textBounds(bureau);
        const width = boat.getBoundingClientRect().width;
        const start = Math.max(0, shoreText.left - area.left);
        const finish = Math.max(start, bureauText.right - area.left - width);
        const split = area.width * .5;
        const distance = Math.max(1, finish - start);
        const clipAt = x => Math.max(0, Math.min(100, (split - x) / width * 100));
        const outboundOffset = x => Math.max(0, Math.min(.5, (x - start) / distance * .5));
        const returnOffset = x => .5 + Math.max(0, Math.min(.5, (finish - x) / distance * .5));

        boat.style.left = start + 'px';
        if (reducedMotion.matches || finish <= start + 2) {
          blue.style.clipPath = 'inset(0 0 0 100%)';
          return;
        }

        const outboundXs = [start, split - width, split - width / 2, split, finish]
          .map(x => Math.max(start, Math.min(finish, x)))
          .filter((x, i, arr) => i === 0 || x > arr[i - 1] + .01);
        const returnXs = [...outboundXs].reverse();
        const moveFrames = [
          { left: start + 'px', transform: 'scaleX(1)', offset: 0 },
          { left: finish + 'px', transform: 'scaleX(1)', offset: .5 },
          { left: finish + 'px', transform: 'scaleX(-1)', offset: .502 },
          { left: start + 'px', transform: 'scaleX(-1)', offset: 1 }
        ];
        const colorFrames = [];
        outboundXs.forEach(x => {
          const pct = clipAt(x);
          colorFrames.push({ clipPath: 'inset(0 0 0 ' + pct + '%)', offset: outboundOffset(x) });
        });
        returnXs.forEach(x => {
          const pct = clipAt(x);
          colorFrames.push({ clipPath: 'inset(0 ' + pct + '% 0 0)', offset: returnOffset(x) });
        });
        colorFrames.sort((a,b) => a.offset - b.offset);

        movement = boat.animate(moveFrames, { duration: 28000, iterations: Infinity, easing: 'linear' });
        color = blue.animate(colorFrames, { duration: 28000, iterations: Infinity, easing: 'linear' });
      }

      positionBoat();
      window.addEventListener('resize', () => {
        clearTimeout(window.__shorelineBoatResize);
        window.__shorelineBoatResize = setTimeout(positionBoat, 150);
      });
      if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', positionBoat);
      window.addEventListener('load', positionBoat, { once: true });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionBoat);
    })();
  </script>
</body>
</html>
