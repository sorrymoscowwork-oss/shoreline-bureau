<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="SHORELINE BUREAU — Independent Property & Place Advisory in Hurghada, Egypt.">
  <title>SHORELINE BUREAU — Independent Property & Place Advisory</title>
  <style>
    :root { color-scheme:light; --ink:#171717; --muted:#77736d; --line:#e8e5df; --accent:#a66b52; }
    * { box-sizing:border-box; }
    html { min-height:100%; scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; background:#fff; color:var(--ink); font-family:Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    .site-header { height:92px; padding:0 clamp(24px,5.2vw,84px); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); position:relative; z-index:20; background:#fff; }
    .wordmark { color:var(--ink); text-decoration:none; font-size:clamp(19px,2vw,25px); font-weight:700; letter-spacing:-.075em; line-height:1; white-space:nowrap; }
    .wordmark span { font-weight:400; }
    .wordmark sup { margin-left:3px; font-size:.28em; font-weight:400; letter-spacing:0; vertical-align:top; }
    .menu-toggle { display:flex; align-items:center; gap:15px; padding:12px 0 12px 16px; border:0; background:transparent; color:var(--ink); cursor:pointer; font:inherit; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
    .menu-icon { width:25px; height:18px; display:flex; flex-direction:column; justify-content:space-between; }
    .menu-icon i { display:block; width:25px; height:1px; background:var(--ink); transition:transform .25s ease, width .25s ease; }
    .menu-toggle[aria-expanded="true"] .menu-icon i:first-child { transform:translateY(8.5px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .menu-icon i:last-child { transform:translateY(-8.5px) rotate(-45deg); }
    .menu-toggle[aria-expanded="true"] .menu-icon i:nth-child(2) { opacity:0; }
    .menu-panel { position:fixed; z-index:10; inset:92px 0 0; display:none; background:rgba(255,255,255,.985); padding:clamp(36px,7vw,100px) clamp(24px,9vw,144px); }
    .menu-panel.is-open { display:flex; flex-direction:column; }
    .menu-kicker { margin:0 0 28px; color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; }
    .menu-links { display:flex; flex-direction:column; align-items:flex-start; gap:clamp(15px,2.8vh,28px); }
    .menu-links a { color:var(--ink); text-decoration:none; font-size:clamp(30px,5.2vw,66px); font-weight:400; letter-spacing:-.065em; line-height:1.05; transition:color .2s ease; }
    .menu-links a:hover, .menu-links a:focus-visible { color:var(--accent); }
    .menu-footer { margin-top:auto; padding-top:40px; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    main { min-height:calc(100vh - 93px); }
    .landing { min-height:calc(100vh - 93px); position:relative; display:grid; grid-template-columns:50% 50%; overflow:hidden; background:#fff; }
    .landing-image { grid-column:1; grid-row:1; min-height:calc(100vh - 93px); overflow:hidden; background:#b6a28b; }
    .landing-image img { display:block; width:100%; height:100%; min-height:calc(100vh - 93px); object-fit:cover; object-position:center 52%; }
    .landing-location { position:absolute; z-index:2; top:calc(23% + clamp(30px,4.2vw,70px) * .98 + 16px); left:0; width:100%; display:grid; grid-template-columns:50% 50%; align-items:baseline; margin:0; font-size:clamp(16px,1.4vw,21px); font-weight:600; letter-spacing:-.045em; line-height:1; text-transform:uppercase; pointer-events:none; }
    .landing-location .hurghada { color:#fff; text-align:right; padding-right:.08em; }
    .landing-location .red-sea { color:var(--ink); text-align:left; padding-left:.08em; }
    .landing-wordmark { position:absolute; z-index:2; inset:23% 0 auto; width:100%; display:grid; grid-template-columns:50% 50%; align-items:baseline; margin:0; white-space:nowrap; font-size:clamp(30px,4.2vw,70px); line-height:.9; letter-spacing:-.095em; font-weight:700; pointer-events:none; }
    .landing-wordmark .shoreline { display:block; color:#fff; text-align:right; padding-right:.08em; }
    .landing-wordmark .bureau { display:block; position:relative; color:var(--ink); font-weight:400; text-align:left; padding-left:.08em; padding-right:.38em; }
    .landing-wordmark .bureau sup { position:absolute; top:-.12em; right:0; margin:0; color:var(--ink); font-size:.16em; line-height:1; letter-spacing:0; }
    @media (max-width:600px) {
      .site-header { height:76px; padding:0 22px; }
      .menu-panel { inset:76px 0 0; padding:52px 26px 32px; }
      .menu-toggle { gap:10px; font-size:10px; }
      main { min-height:calc(100svh - 77px); }
      .landing { min-height:calc(100svh - 77px); grid-template-columns:50% 50%; }
      .landing-image, .landing-image img { min-height:calc(100svh - 77px); }
      .landing-image img { object-position:48% center; }
      .landing-location { top:calc(23% + clamp(19px,6vw,32px) * .98 + 10px); left:0; width:100%; font-size:clamp(10px,2.7vw,14px); letter-spacing:-.045em; }
      .landing-wordmark { inset:23% 0 auto; font-size:clamp(19px,6vw,32px); letter-spacing:-.09em; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="SHORELINE BUREAU home">SHORELINE <span>BUREAU</span><sup>®</sup></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span>Menu</span><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </header>
  <nav class="menu-panel" id="site-menu" aria-label="Main navigation">
    <p class="menu-kicker">Explore Shoreline Bureau</p>
    <div class="menu-links">
      <a href="/about/">About us</a>
      <a href="/services/">Our services</a>
      <a href="/pricing/">Pricing</a>
      <a href="/process/">How we work</a>
    </div>
    <div class="menu-footer">Independent Property &amp; Place Advisory · Hurghada, Egypt</div>
  </nav>
  <main>
    <section class="landing" aria-label="SHORELINE BUREAU">
      <div class="landing-image"><img src="/assets/shoreline-courtyard.png" alt="Sunlit residential architecture in Hurghada, Egypt"></div>
      <p class="landing-location"><span class="hurghada">HURGHADA</span><span class="red-sea">RED SEA</span></p>
      <h1 class="landing-wordmark"><span class="shoreline">SHORELINE</span> <span class="bureau">BUREAU<sup>®</sup></span></h1>
    </section>
  </main>
  <script>
    const toggle = document.querySelector('.menu-toggle');
    const menu = document.querySelector('.menu-panel');
    function closeMenu() { toggle.setAttribute('aria-expanded','false'); menu.classList.remove('is-open'); }
    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(open));
      menu.classList.toggle('is-open', open);
    });
    menu.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
  </script>
</body>
</html>
